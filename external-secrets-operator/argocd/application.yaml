---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: external-secrets

  source:
    repoURL: https://github.com/ebeaudoi/ocp-external-secret.git
    targetRevision: main
    path: external-secrets-operator/overlays/full

  destination:
    server: https://kubernetes.default.svc
    # Resources target their own namespaces via kustomize
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 15
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
