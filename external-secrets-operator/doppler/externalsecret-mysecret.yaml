apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mysecret
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: mysecret
    creationPolicy: Owner
  data:
    - secretKey: MYSECRET
      remoteRef:
        key: MYSECRET
