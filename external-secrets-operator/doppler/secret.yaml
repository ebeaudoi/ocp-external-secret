apiVersion: v1
kind: Secret
metadata:
  name: doppler-token-auth
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "3"
type: Opaque
stringData:
  # Do not commit a real token. Create/patch this Secret on the cluster instead:
  #   oc create secret generic doppler-token-auth -n external-secrets \
  #     --from-literal=dopplerToken='dp.st....' \
  #     --dry-run=client -o yaml | oc apply -f -
  dopplerToken: REPLACE_WITH_DOPPLER_SERVICE_TOKEN
