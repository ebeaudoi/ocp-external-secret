---
kind: Kustomization
apiVersion: kustomize.config.k8s.io/v1beta1

namespace: openshift-operators

resources:
  - ../../base

commonAnnotations:
  argocd.argoproj.io/sync-wave: "0"

patches:
  - target:
      kind: Subscription
      name: external-secrets-operator
    patch: |-
      - op: replace
        path: /spec/channel
        value: stable
      - op: replace
        path: /spec/source
        value: redhat-operators
